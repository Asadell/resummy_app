name: resummy_app
description: 'AI-powered resume builder and career preparation app'
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1
  google_generative_ai: ^0.4.4
  audioplayers: ^6.1.0
  audio_waveforms: ^1.0.5
  permission_handler: ^11.3.0
  http: ^1.2.2

  # Routing
  auto_route: ^9.2.2

  # UI
  google_fonts: ^6.1.0
  sizer: ^2.0.15
  iconsax_flutter: ^1.0.1

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.5
  uuid: ^4.5.1
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  dio: ^5.9.1
  file_picker: ^10.3.10
  syncfusion_flutter_pdf: ^32.2.3
  envied: ^1.3.3

  # Dependency Injection
  get_it: ^8.0.0

  # etc
  change_app_package_name: ^1.5.0
  flutter_sound: ^9.2.13
  syncfusion_flutter_pdfviewer: ^32.2.4
  intl_phone_field: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.5.4
  auto_route_generator: ^9.0.0
  envied_generator: ^1.1.1

  # App Icon
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true
  image_path: 'assets/icon/icon.png'

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icon/
